name: Build Windows exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe
        run: python build.py

      - name: Get version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME:-dev}" >> $GITHUB_OUTPUT

      - name: Rename exe with version
        shell: bash
        run: mv dist/pointoflight.exe "dist/pointoflight-${{ steps.ver.outputs.version }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointoflight-exe
          path: dist/pointoflight-*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pointoflight-*.exe
          generate_release_notes: true
